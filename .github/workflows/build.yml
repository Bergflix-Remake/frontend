name: Build
on: [push, pull_request]
jobs:
  lint:
    name: Lint 🎨
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Node 🥐
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Lint 🚚
        run: |
          npm ci
          npm run lint
  build:
    name: Build 🔨
    needs:
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Node 🥐
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build
      - name: Store artifacts 📦
        uses: actions/upload-artifact@v4
        with:
          path: dist
