name: Build
on: [push]
jobs:
  lint:
    name: Lint 🎨
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Setup Bun 🥐
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.9"
      - name: Lint 🚚
        run: |
          bun install --frozen-lockfile
          bun run lint
  build:
    name: Build 🔨
    needs:
      - lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Bun 🥐
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: "1.3.9"

      - name: Install and Build 🔧
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Store artifacts 📦
        uses: actions/upload-artifact@v7
        with:
          path: dist
